name: myapp
description: "Palay Patrol - rice pest observation, technician validation, treatment options and follow-up monitoring."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

# go_router 18.x and camera 0.12.1 both require Flutter 3.44 / Dart 3.12 or newer.
# Run `flutter --version` and make sure your Dart version is >= 3.12.
# If it is not, use pubspec.dart39.yaml instead.
environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  cupertino_icons: ^1.0.9
  go_router: ^18.0.1
  path: ^1.9.1
  path_provider: ^2.1.5
  http: ^1.2.1
  flutter_secure_storage: ^9.0.8
  shared_preferences: ^2.2.2
  sqflite: ^2.3.3
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image_picker: ^1.2.3
  flutter_local_notifications: ^22.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:

    - assets/branding/